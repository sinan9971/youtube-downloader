name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj ovisnosti za Buildozer i Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Izradi APK pomoću Buildozera
        run: |
          buildozer android debug

      - name: Spremi APK kao artefakt za preuzimanje
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Downloader-APK
          path: bin/*.apk
