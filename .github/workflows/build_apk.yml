name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj ovisnosti za Buildozer i Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libtinfo6 cmake libffi-dev libssl-dev libncurses-dev || true
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 virtualenv yt-dlp

      - name: Uključi yt-dlp unutar mape aplikacije
        run: |
          pip install yt-dlp --no-deps --target .

      - name: Očisti predmemoriju Buildozera
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin

      - name: Izradi APK pomoću Buildozera
        run: |
          buildozer -v android debug

      - name: Spremi APK kao artefakt za preuzimanje
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Downloader-APK
          path: bin/*.apk
