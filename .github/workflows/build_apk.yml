name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git zip unzip zlib1g-dev libssl-dev libffi-dev libltdl-dev
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Uključi yt-dlp unutar mape aplikacije
        run: |
          pip install yt-dlp --no-deps --target .

      - name: Build with Buildozer
        run: |
          unset ANDROID_NDK
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          buildozer -v android debug

      - name: Spremi APK kao artefakt za preuzimanje
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Downloader-APK
          path: bin/*.apk
